name: ezinvoice
description: "A new Flutter project."
publish_to: 'none'

version: 3.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  image_picker: ^1.0.4
  path_provider: ^2.1.1
  sqflite: ^2.4.2
  google_sign_in: ^6.2.1
  googleapis: ^13.0.0
  googleapis_auth: ^2.0.0
  sign_in_button: ^3.2.0
  google_fonts: ^6.2.1
  excel: ^4.0.6

  share_plus: ^7.2.1
  url_launcher: ^6.0.0

  # State Management
  flutter_riverpod: ^2.4.9

  # Icons
  font_awesome_flutter: ^10.6.0

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.0
  firebase_auth: ^5.3.0

  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.13.0

  # Number to Words
  number_to_indian_words: ^1.0.1

  # Persistent Storage
  shared_preferences: ^2.2.2

  # Image Compression
  flutter_image_compress: ^2.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/ezinvoice.png"
  adaptive_icon_foreground: "assets/icons/ezinvoice.png"
  adaptive_icon_background: "#0064E0"
